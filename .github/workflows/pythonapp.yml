# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12' 

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install flake8 pylint pytest
        python3 -m pip install -r requirements.txt
    - name: Run tests
      env:
        # Placeholders, not secrets. clients/__init__.py builds every third-party SDK client at
        # import time and several reject empty credentials, so collection fails without *some*
        # value here. No test makes a live call -- HTTP is faked via tests/aiohttp_mocks.py and
        # the DB engines are created lazily, so the dummy URI is never connected to.
        ENVIRONMENT: development
        SQLALCHEMY_DATABASE_URI: mysql+pymysql://ci:ci@127.0.0.1:3306/ci
        REDDIT_CLIENT_ID: ci
        REDDIT_CLIENT_SECRET: ci
        GENIUS_ACCESS_TOKEN: ci
        METRIC_SYSTEM_USERS: ''
      run: |
        # database/__init__.py builds an ssl.SSLContext at import time; the real CA cert lives
        # in creds/, which is gitignored, so stand in a throwaway self-signed one.
        mkdir -p creds
        openssl req -x509 -newkey rsa:2048 -nodes -keyout /dev/null \
          -out creds/ca-certificate.crt -days 1 -subj '/CN=ci'
        # tests/ is excluded: its autouse cleanup fixture opens a real MySQL session.
        pytest broiestbot -q
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
